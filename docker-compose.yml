# Chạy đủ bộ: Postgres + genealogy-api + genealogy-web. Mô hình theo
# ../fashion-web/docker-compose.yml (bỏ phần MinIO/GHCR vì dự án này lưu ảnh
# đại diện trên đĩa và chưa có CI đẩy image).
#
#   cp .env.example .env     # điền POSTGRES_PASSWORD và JWT_SECRET (bắt buộc)
#   docker compose up --build -d
#
# Chỉ frontend publish port ra máy chủ, mặc định nghe 0.0.0.0:3000 (mở được từ
# máy khác trong mạng). Khi đưa lên server thật thì nên đặt FRONTEND_BIND=127.0.0.1
# và để reverse proxy (nginx...) lo HTTPS; khi đó đặt COOKIE_SECURE=true và
# FRONTEND_ORIGIN=https://<domain> trong .env. API và Postgres KHÔNG publish
# port nào; web gọi API qua tên service ("api") trong mạng nội bộ, browser chỉ
# nói chuyện với web (/api/* và /uploads/* được web proxy sang API).
#
# 2 network:
#   - "public_net": web + api — chỉ để có đường ra Internet (API gửi mail SMTP
#     quên mật khẩu). Không service nào ngoài web publish port.
#   - "private_net" (internal: true, không ra Internet): db + api + web nói
#     chuyện với nhau. db chỉ nằm trên mạng này.
#
# Image: có `build:` nên chạy được ngay từ source; có thêm `image:` để chạy được
# image dựng sẵn khi đặt API_IMAGE/WEB_IMAGE (+ *_IMAGE_TAG) trong .env.
# Sao lưu: scripts/backup.sh (Postgres + uploads) và scripts/restore.sh, xem docs/SAO-LUU.md.

name: genealogy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  # Truyền từng phần thay vì một DATABASE_URL: API tự dựng URL và mã hoá
  # mật khẩu, nên mật khẩu chứa @ : / # ? ... vẫn dùng được.
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  JWT_SECRET: ${JWT_SECRET:?thiếu JWT_SECRET trong .env}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  # Origin mà browser thật sự dùng để mở web — CORS và cookie dựa vào nó.
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  UPLOAD_DIR: /app/uploads
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  # Giới hạn tần suất đăng nhập, quên mật khẩu, link mời... (xem DOCKER.md "Bảo mật & vận hành"). TRUSTED_PROXY_HOPS=1 chỉ khi
  # có nginx/Caddy phía trước web và nó ghi đè X-Forwarded-For; để 0 nếu không (mặc định).
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}

services:

  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?thiếu POSTGRES_DB trong .env}
    volumes:
      # postgres:18+ đổi convention: mount ở /var/lib/postgresql (không phải
      # .../data như bản 16) — image tự tạo thư mục con theo major version.
      # Mount nhầm chỗ cũ sẽ crash-loop ngay lúc khởi động.
      - postgres_data:/var/lib/postgresql
    networks:
      - private_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  api:
    build: ./genealogy-api
    image: ${API_IMAGE:-genealogy-api}:${API_IMAGE_TAG:-latest}
    environment: *api-environment
    volumes:
      - uploads_data:/app/uploads
      # Bản sao lưu do scripts/backup.sh ghi (chỉ đọc): trang Quản trị → Sao lưu chỉ hiện tình trạng, không tải/tạo bản nào.
      # Tạo thư mục trước (mkdir -p backups) để nó thuộc user của bạn, không phải root do Docker tự tạo.
      - ${BACKUP_HOST_DIR:-./backups}:/app/backups:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      # private_net là internal:true (không ra Internet) — api join thêm
      # public_net để gửi được mail SMTP. Không publish port nào ở đây.
      - private_net
      - public_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # Hourly reminders (GĐ5): notifies people before a giỗ/event (in the web app and, when SMTP_HOST is set, by email).
  # Same image and settings as the api; idempotent, so restarts and overlapping runs never duplicate a reminder.
  worker:
    build: ./genealogy-api
    image: ${API_IMAGE:-genealogy-api}:${API_IMAGE_TAG:-latest}
    command: ["python", "scripts/run_reminders.py", "--interval", "3600"]
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy  # the api applies the migrations the worker's tables come from
    networks:
      - private_net
      - public_net  # SMTP
    restart: unless-stopped
    # Mức sống còn: còn với tới được database (vòng lặp chạy cả giờ mới ghi log một lần nên không có tín hiệu "vừa chạy").
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('db', 5432), 3).close()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  web:
    build:
      context: ./genealogy-web
      args:
        # Với output "standalone", rewrites() của next.config.ts chỉ chạy 1 lần
        # lúc `next build` và bị đóng băng vào image: đây phải là địa chỉ API
        # TRONG mạng Docker (tên service "api"). Đổi giá trị này thì phải build
        # lại (`docker compose up --build`).
        API_BASE_URL: http://api:8000
    image: ${WEB_IMAGE:-genealogy-web}:${WEB_IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    networks:
      - public_net
      - private_net
    restart: unless-stopped
    healthcheck:
      # "/" redirect sang /login khi chưa đăng nhập (middleware) — 3xx vẫn là sống.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

networks:
  # MTU mặc định 1500. Nếu hạ tầng mạng của server nhỏ hơn (vd 1492, như
  # fashion-web đo được: `ping -M do -s 1472 <host>` báo "mtu = 1492"), gói lớn
  # bị rớt âm thầm gây treo khi API gọi ra ngoài — đặt DOCKER_NETWORK_MTU=1492.
  public_net:
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_NETWORK_MTU:-1500}"
  private_net:
    internal: true
    driver_opts:
      com.docker.network.driver.mtu: "${DOCKER_NETWORK_MTU:-1500}"

volumes:
  postgres_data:
  uploads_data:
